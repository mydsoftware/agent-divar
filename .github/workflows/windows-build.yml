name: Windows EXE Build

on:
  pull_request:
    paths:
      - "app.py"
      - "app_paths.py"
      - "tests/test_app_paths.py"
      - "tests/test_windows_release_backup.py"
      - "tests/windows_installer_e2e.ps1"
      - "browser_runner.py"
      - "AgentDivar.spec"
      - "build_windows.ps1"
      - "VERSION"
      - "version.py"
      - "installer/**"
      - "docs/WINDOWS_INSTALLER_FA.md"
      - "docs/WINDOWS_E2E_VALIDATION_FA.md"
      - "requirements.txt"
      - "storage.py"
      - "followup_manager.py"
      - "dashboard.py"
      - "property_media.py"
      - "media_tab.py"
      - "backup_manager.py"
      - "backup_tab.py"
      - "settings_manager.py"
      - "settings_tab.py"
      - "diagnostics_manager.py"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4
      - name: نصب Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: نصب Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: ساخت EXE و نصب‌کننده و اجرای آزمون دود
        shell: pwsh
        run: .\build_windows.ps1
      - name: آزمون سرتاسری نصب، ارتقا و حذف نصب
        shell: pwsh
        run: .\\tests\\windows_installer_e2e.ps1
      - name: بارگذاری گزارش آزمون ویندوز
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AgentDivar-Windows-E2E-Logs
          path: artifacts/windows-e2e/
          if-no-files-found: warn
          retention-days: 14
      - name: بارگذاری بسته اجرایی
        uses: actions/upload-artifact@v4
        with:
          name: AgentDivar-Windows-x64
          path: |
            dist/AgentDivar/
            dist/AgentDivar-Portable-*.zip
            dist/AgentDivar-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

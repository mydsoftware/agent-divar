name: Agent Divar CI

on:
  push:
    paths:
      - "app.py"
      - "browser_runner.py"
      - "storage.py"
      - "followup_manager.py"
      - "dashboard.py"
      - "property_media.py"
      - "media_tab.py"
      - "backup_manager.py"
      - "backup_tab.py"
      - "install_windows.ps1"
      - "run_windows.bat"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "app.py"
      - "browser_runner.py"
      - "storage.py"
      - "followup_manager.py"
      - "dashboard.py"
      - "property_media.py"
      - "media_tab.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application and tests
        run: python -m compileall -q app.py browser_runner.py storage.py followup_manager.py dashboard.py property_media.py media_tab.py backup_manager.py backup_tab.py tests
      - name: Run test suite
        run: python -m unittest discover -s tests -v
